<nav class="mobile-tabbar" id="mobile-tabbar">
  <button class="mtab" id="mtab-home" onclick="goHome()" aria-label="หน้าแรก">
    <svg class="mtab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>

  </button>
  <button class="mtab" id="mtab-journal" onclick="goJournal()" aria-label="บันทึกของฉัน">
    <svg class="mtab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4a2 2 0 012-2h8a2 2 0 012 2v17l-6-3.5L6 21V4z"/></svg>
    <span class="mtab-label">บันทึก</span>
  </button>
  <button class="mtab" id="mtab-premium" onclick="goPremiumStore()" aria-label="ไพ่พรีเมียม">

    <svg class="mtab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M9.5 15c.4.7 1.4 1.2 2.5 1.2 1.6 0 2.8-.8 2.8-2s-1.2-1.6-2.8-2-2.8-.8-2.8-2 1.2-2 2.8-2c1.1 0 2 .5 2.5 1.2"/><path d="M12 7v1.3M12 15.7V17"/></svg>

<div class="modal-overlay" id="delete-modal-overlay" onclick="if(event.target===this) closeDeleteModal();">
  <div class="modal-card">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/><path d="M10 11v6M14 11v6"/></svg>
    </div>
    <h3>ลบบันทึกนี้?</h3>
    <p id="delete-modal-question">การลบไม่สามารถย้อนกลับได้</p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeDeleteModal()">ยกเลิก</button>
      <button class="btn-danger" onclick="confirmDeleteJournal()">ลบบันทึก</button>
    </div>
  </div>
</div>

<!-- ป็อปอัพแจ้งเติมเหรียญสำเร็จ (public/partials/topup.html) — ต้องอยู่นอก .screen เสมอ ไม่ใช่ในไฟล์ partial
     เพราะ .screen มี animation ที่ใช้ transform (fadeUp) ซึ่งทำให้ .screen กลายเป็น containing block ของ
     position:fixed ลูกๆ ไปด้วย (พฤติกรรมมาตรฐานของ CSS) ผลคือฉากหลังสีทึบของป็อปอัพจะครอบแค่กรอบของ .screen
     แทนที่จะเต็มจอจริง — วางไว้ที่ shell นี้เหมือน delete-modal-overlay ด้านบนแทนถึงจะเต็มจอเสมอไม่ว่าจะอยู่หน้าไหน -->
<div class="modal-overlay" id="topup-success-modal-overlay">
  <div class="modal-card">
    <div class="modal-icon modal-icon-success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h3>เติมเหรียญสำเร็จ!</h3>
    <p>คุณได้รับ <b id="topup-success-coins">🪙</b> เหรียญเข้าบัญชีเรียบร้อยแล้ว</p>
    <div class="modal-actions">
      <button class="btn-primary" onclick="closeTopupSuccessModal()" style="width:100%; justify-content:center;">กลับหน้าหลัก</button>
    </div>
  </div>
</div>
