    <button class="back-link" onclick="showScreen('ask')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>
      แก้ไขคำถาม
    </button>

      <div class="progress-pill" id="draw-progress"></div>

    <div class="draw-stage" id="draw-stage">
      <div class="shuffle-overlay" id="shuffle-overlay"></div>
      <div class="fan-wrap" id="fan-wrap"></div>
    </div>
    <div class="draw-footer">
      <button class="btn-primary" id="draw-cta" style="display:none;" onclick="submitDraw()">ดูคำทำนาย</button>
    </div>
