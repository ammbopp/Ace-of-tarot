    <button class="back-link" onclick="goHome()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>
      กลับหน้าแรก
    </button>

    <div class="panel admin-panel">
      <h2>Admin Dashboard</h2>
      <p class="sub">ภาพรวมยอดขาย ผู้ใช้ และคำทำนายทั้งหมดในระบบ</p>
      <div id="admin-content">
        <div class="journal-empty">กำลังโหลดข้อมูล...</div>
      </div>
    </div>

<script>
// เช็คกับ server ว่าบัญชีที่ล็อกอินอยู่เป็นแอดมินไหม (แค่ใช้ตัดสินใจโชว์ปุ่ม Admin ใน nav — ไม่ใช่ตัวตัดสินสิทธิ์จริง
// /api/admin/stats เช็คสิทธิ์ซ้ำของตัวเองเสมอที่ server ต่อให้ปลอมค่านี้ฝั่ง client ก็เข้าดูข้อมูลจริงไม่ได้)
async function checkIsAdmin(){
  try{
    const response = await authFetch('/api/admin/check');
    if(!response) return false; // ไม่ได้ล็อกอิน
    const data = await response.json();
    return !!data.isAdmin;
  }catch(e){ return false; }
}

function goAdmin(){
  renderAdminDashboard();
  showScreen('admin');
}

function formatBaht(satang){
  return ((satang || 0) / 100).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

async function renderAdminDashboard(){
  const container = document.getElementById('admin-content');
  if(!container) return;
  container.innerHTML = `<div class="journal-empty">กำลังโหลดข้อมูล...</div>`;

  try{
    const response = await authFetch('/api/admin/stats');
    if(!response){
      container.innerHTML = `<div class="journal-empty"><div>กรุณา <a onclick="goAuth()">เข้าสู่ระบบ</a> ก่อน</div></div>`;
      return;
    }
    const data = await response.json();
    if(response.status === 403){
      container.innerHTML = `<div class="journal-empty"><div>บัญชีนี้ไม่มีสิทธิ์เข้าถึงหน้านี้</div></div>`;
      return;
    }
    if(!response.ok || !data.success){
      throw new Error(data.error || 'โหลดข้อมูลไม่สำเร็จ');
    }
    renderAdminStats(data.stats || {});
    loadSupportReports(); // แยก request ต่างหาก ไม่ปนกับ stats — พังจุดนี้ไม่ควรทำให้สถิติด้านบนหายไปด้วย
  }catch(err){
    container.innerHTML = `<div class="journal-empty"><div>${escapeHtml(err.message || 'เกิดข้อผิดพลาด')}</div></div>`;
  }
}

function renderAdminStats(stats){
  const container = document.getElementById('admin-content');
  if(!container) return;

  const statCard = (label, value) => `
    <div class="admin-stat-card">
      <div class="admin-stat-value">${value}</div>
      <div class="admin-stat-label">${label}</div>
    </div>`;

  const statsGridHtml = `
    <div class="admin-stats-grid">
      ${statCard('ยอดขายรวม', '฿' + formatBaht(stats.totalRevenueSatang))}
      ${statCard('จำนวนครั้งเติมเงิน', (stats.totalTopups || 0).toLocaleString('th-TH'))}
      ${statCard('ผู้ใช้ทั้งหมด', (stats.totalUsers || 0).toLocaleString('th-TH'))}
      ${statCard('ผู้ใช้ active (7 วัน)', (stats.activeUsers || 0).toLocaleString('th-TH'))}
      ${statCard('คำทำนายทั้งหมด', (stats.totalReadings || 0).toLocaleString('th-TH'))}
    </div>`;

  const barRow = (label, count, max, fillClass) => `
    <div class="admin-bar-row">
      <div class="admin-bar-label">${label}</div>
      <div class="admin-bar-track"><div class="admin-bar-fill ${fillClass || ''}" style="width:${max ? Math.round(count / max * 100) : 0}%"></div></div>
      <div class="admin-bar-count">${count}</div>
    </div>`;

  // หมวดคำถามยอดฮิต
  const catCounts = stats.readingsByCategory || {};
  const catEntries = CATEGORIES
    .map(c => ({ label: `${c.icon} ${escapeHtml(c.label)}`, count: catCounts[c.key] || 0 }))
    .sort((a, b) => b.count - a.count);
  const maxCatCount = Math.max(0, ...catEntries.map(c => c.count));
  const catBarsHtml = catEntries.map(c => barRow(c.label, c.count, maxCatCount)).join('');

  // ไพ่พรีเมียมขายดี
  const spreadCounts = stats.readingsBySpreadKey || {};
  const premiumEntries = PREMIUM_CATALOG
    .map(p => ({ label: escapeHtml(p.label), count: spreadCounts[p.key] || 0 }))
    .sort((a, b) => b.count - a.count);
  const maxPremiumCount = Math.max(0, ...premiumEntries.map(p => p.count));
  const premiumBarsHtml = premiumEntries.map(p => barRow(p.label, p.count, maxPremiumCount, 'admin-bar-fill-gold')).join('');

  // รายการเติมเงินล่าสุด
  const recentTopups = Array.isArray(stats.recentTopups) ? stats.recentTopups : [];
  const topupRowsHtml = recentTopups.length
    ? recentTopups.map(t => {
        const d = new Date(t.created_at);
        const dateStr = d.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' }) + ' ' + d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
        return `<tr><td>${dateStr}</td><td>🪙 ${t.package_coins}</td><td>฿${formatBaht(t.package_amount_satang)}</td></tr>`;
      }).join('')
    : `<tr><td colspan="3" style="text-align:center; color:#9A8AB3;">ยังไม่มีรายการ</td></tr>`;

  container.innerHTML = `
    ${statsGridHtml}
    <div class="admin-section">
      <h3>หมวดคำถามยอดฮิต</h3>
      ${catBarsHtml || '<p class="sub">ยังไม่มีข้อมูล</p>'}
    </div>
    <div class="admin-section">
      <h3>ไพ่พรีเมียมขายดี</h3>
      ${premiumBarsHtml || '<p class="sub">ยังไม่มีข้อมูล</p>'}
    </div>
    <div class="admin-section">
      <h3>รายการเติมเงินล่าสุด</h3>
      <table class="admin-table">
        <thead><tr><th>วันที่</th><th>แพ็กเกจ</th><th>จำนวนเงิน</th></tr></thead>
        <tbody>${topupRowsHtml}</tbody>
      </table>
    </div>
    <div class="admin-section" id="admin-support-section"></div>
  `;
}

/* ---------------- คำร้อง/แจ้งปัญหาจากผู้ใช้ (public/partials/support.html ส่งเข้ามา) ---------------- */
const SUPPORT_CATEGORY_LABEL = { bug: '🐞 บั๊ก/ใช้งานไม่ได้', payment: '💳 การชำระเงิน/เหรียญ', account: '👤 บัญชีผู้ใช้', other: '💬 อื่นๆ' };
// แคชรายการล่าสุดไว้ใช้ตอนเปิด modal ดูรายละเอียด (กดแถวในตาราง) กันไม่ต้องยิง API ซ้ำ — ดู
// openSupportDetailModal() ด้านล่าง
window._supportReportsCache = [];

function isSupportAttachmentImage(path){
  return /\.(jpg|jpeg|png|webp|gif)$/i.test(path || '');
}
function formatSupportDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' }) + ' ' + d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
}

async function loadSupportReports(){
  const section = document.getElementById('admin-support-section');
  if(!section) return;
  section.innerHTML = `<h3>คำร้อง/แจ้งปัญหา</h3><div class="journal-empty">กำลังโหลดข้อมูล...</div>`;
  try{
    const response = await authFetch('/api/admin/support-reports');
    const data = response ? await response.json() : null;
    if(!response || !response.ok || !data || !data.success){
      throw new Error((data && data.error) || 'โหลดรายการคำร้องไม่สำเร็จ');
    }
    renderSupportReports(data.reports || []);
  }catch(err){
    section.innerHTML = `<h3>คำร้อง/แจ้งปัญหา</h3><p class="sub">${escapeHtml(err.message || 'เกิดข้อผิดพลาด')}</p>`;
  }
}

function renderSupportReports(reports){
  window._supportReportsCache = reports;
  const section = document.getElementById('admin-support-section');
  if(!section) return;

  const openCount = reports.filter(r => r.status === 'open').length;
  if(reports.length === 0){
    section.innerHTML = `<h3>คำร้อง/แจ้งปัญหา</h3><p class="sub">ยังไม่มีคำร้องเข้ามา</p>`;
    return;
  }

  // แถวทั้งแถวกดเปิดดูรายละเอียด/ติดต่อ/แก้ไขได้ในที่เดียว (openSupportDetailModal) — ปุ่ม/ลิงก์ภายในแถว
  // (mailto, ไฟล์แนบ, ปุ่มแก้ไขด่วน) ต้อง stopPropagation กันคลิกทะลุไปเปิด modal ซ้อนโดยไม่ตั้งใจ
  const rowsHtml = reports.map(r => {
    const catLabel = SUPPORT_CATEGORY_LABEL[r.category] || r.category;
    const action = r.status === 'open'
      ? `<button class="admin-resolve-btn" onclick="event.stopPropagation(); resolveSupportReport('${r.id}', '')">ทำเครื่องหมายว่าแก้ไขแล้ว</button>`
      : `<span class="admin-resolved-badge">แก้ไขแล้ว</span>`;
    let attachmentCell = '-';
    if(r.attachmentUrl){
      attachmentCell = isSupportAttachmentImage(r.attachment_path)
        ? `<a href="${r.attachmentUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation();"><img src="${r.attachmentUrl}" class="admin-attachment-thumb" alt="ไฟล์แนบ"></a>`
        : `<a href="${r.attachmentUrl}" target="_blank" rel="noopener" class="admin-attachment-link" onclick="event.stopPropagation();">📄 เปิดไฟล์</a>`;
    }
    const emailCell = r.contact_email
      ? `<a href="mailto:${encodeURIComponent(r.contact_email)}" class="admin-mailto-link" onclick="event.stopPropagation();">${escapeHtml(r.contact_email)}</a>`
      : '-';
    return `<tr class="admin-row-clickable" onclick="openSupportDetailModal('${r.id}')">
      <td>${formatSupportDate(r.created_at)}</td>
      <td>${catLabel}</td>
      <td>${emailCell}</td>
      <td style="white-space:pre-wrap; max-width:280px;">${escapeHtml(r.message)}</td>
      <td>${attachmentCell}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');

  section.innerHTML = `
    <h3>คำร้อง/แจ้งปัญหา ${openCount > 0 ? `<span class="admin-open-count">${openCount} ยังไม่ได้จัดการ</span>` : ''}</h3>
    <p class="sub" style="margin-top:-4px;">คลิกที่แถวเพื่อดูรายละเอียดเต็ม ติดต่อผู้แจ้ง หรือแก้ไขพร้อมส่งข้อความแจ้งกลับ</p>
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead><tr><th>วันที่</th><th>หมวดหมู่</th><th>อีเมลติดต่อกลับ</th><th>รายละเอียด</th><th>ไฟล์แนบ</th><th>สถานะ</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;
}

/* ---------------- Modal รายละเอียดคำร้อง — ดู/ติดต่อ/แก้ไขในที่เดียว ---------------- */
// modal อยู่ใน public/index.html (นอก .screen เสมอ กัน .screen{transform:...} บัง position:fixed)
function openSupportDetailModal(id){
  const r = window._supportReportsCache.find(x => x.id === id);
  const body = document.getElementById('support-detail-body');
  if(!r || !body) return;

  const catLabel = SUPPORT_CATEGORY_LABEL[r.category] || r.category;
  const isOpen = r.status === 'open';

  let attachmentHtml = '';
  if(r.attachmentUrl){
    attachmentHtml = isSupportAttachmentImage(r.attachment_path)
      ? `<a href="${r.attachmentUrl}" target="_blank" rel="noopener"><img src="${r.attachmentUrl}" style="max-width:100%; max-height:280px; object-fit:contain; border-radius:12px; margin-top:14px; border:1px solid rgba(140,103,180,.25); display:block;"></a>`
      : `<div style="margin-top:14px;"><a href="${r.attachmentUrl}" target="_blank" rel="noopener" class="admin-attachment-link">📄 เปิดไฟล์แนบ</a></div>`;
  }

  const resolvedHtml = !isOpen ? `
    <div class="sd-resolved-box">
      <div class="sd-resolved-label">✓ แก้ไขแล้ว${r.resolved_at ? ' เมื่อ ' + formatSupportDate(r.resolved_at) : ''}</div>
      ${r.resolution_note ? `<div class="sd-resolved-note">${escapeHtml(r.resolution_note)}</div>` : ''}
    </div>` : '';

  const resolveFormHtml = isOpen ? `
    <div class="sd-resolve-form">
      <label for="sd-note-input">บันทึกการแก้ไข (ไม่บังคับ — จะแนบไปในอีเมลแจ้งผู้ใช้ด้วย)</label>
      <textarea id="sd-note-input" rows="3" placeholder="เช่น เพิ่มเหรียญให้เรียบร้อยแล้วค่ะ ขออภัยในความไม่สะดวก"></textarea>
      <div class="modal-actions">
        <button class="btn-ghost" onclick="closeSupportDetailModal()">ปิด</button>
        <button class="btn-primary" onclick="resolveSupportReportFromModal('${r.id}')">✓ ทำเครื่องหมายว่าแก้ไขแล้ว</button>
      </div>
    </div>` : `
    <div class="modal-actions"><button class="btn-ghost" onclick="closeSupportDetailModal()" style="width:100%;">ปิด</button></div>`;

  body.innerHTML = `
    <h3>${catLabel}</h3>
    <div class="sd-meta">${formatSupportDate(r.created_at)}${r.user_id ? ' · ผู้ใช้ที่ล็อกอินอยู่' : ' · guest (ไม่ได้ล็อกอิน)'}</div>
    ${r.contact_email ? `<div class="sd-contact">ติดต่อกลับ: <a href="mailto:${encodeURIComponent(r.contact_email)}?subject=${encodeURIComponent('[Ace of Tarot] เกี่ยวกับคำร้องของคุณ — ' + catLabel)}">✉️ ${escapeHtml(r.contact_email)}</a></div>` : ''}
    <div class="sd-message">${escapeHtml(r.message)}</div>
    ${attachmentHtml}
    ${resolvedHtml}
    ${resolveFormHtml}
  `;
  document.getElementById('support-detail-modal-overlay').classList.add('active');
}
function closeSupportDetailModal(){
  document.getElementById('support-detail-modal-overlay').classList.remove('active');
}
async function resolveSupportReportFromModal(id){
  const noteInput = document.getElementById('sd-note-input');
  await resolveSupportReport(id, noteInput ? noteInput.value : '');
  closeSupportDetailModal();
}

async function resolveSupportReport(id, resolutionNote){
  try{
    const response = await authFetch(`/api/admin/support-reports/${id}/resolve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resolutionNote: resolutionNote || '' })
    });
    const data = response ? await response.json() : null;
    if(!response || !response.ok || !data || !data.success){
      throw new Error((data && data.error) || 'ทำเครื่องหมายว่าแก้ไขแล้วไม่สำเร็จ');
    }
    loadSupportReports(); // โหลดใหม่ทั้งลิสต์ ง่ายและชัวร์กว่าไปไล่แก้ DOM แถวเดียว
  }catch(err){
    alert(err.message || 'เกิดข้อผิดพลาด');
  }
}
</script>
