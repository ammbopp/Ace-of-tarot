    <button class="back-link" onclick="goHome()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>
      <span data-i18n="ask.backHome">กลับหน้าแรก</span>
    </button>

    <div class="auth-card">
      <h2 id="auth-title" data-i18n="nav.login">เข้าสู่ระบบ</h2>
      <p id="auth-subtitle" class="auth-subtitle" data-i18n="auth.loginSubtitle">เข้าสู่ระบบเพื่อดูประวัติคำทำนายของคุณได้จากทุกอุปกรณ์</p>

      <div id="auth-error" class="auth-error" style="display:none;"></div>

      <!-- เข้าสู่ระบบ / สมัครสมาชิก -->
      <form id="auth-form" onsubmit="handleAuthFormSubmit(event)">
        <div class="auth-field">
          <label for="auth-email" data-i18n="auth.emailLabel">อีเมล</label>
          <input type="email" id="auth-email" name="email" placeholder="you@example.com" autocomplete="username" list="auth-email-history">
          <datalist id="auth-email-history"></datalist>
        </div>
        <div class="auth-field">
          <label for="auth-password" data-i18n="auth.passwordLabel">รหัสผ่าน</label>
          <div class="auth-password-wrap">
            <input type="password" id="auth-password" name="password" data-i18n-placeholder="auth.passwordPlaceholder" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="current-password">
            <button type="button" class="auth-toggle-pw" id="auth-toggle-pw-btn" onclick="toggleAuthPasswordVisibility()" data-i18n-aria-label="auth.showPassword" aria-label="แสดงรหัสผ่าน" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="auth-remember-row">
          <label class="auth-remember">
            <input type="checkbox" id="auth-remember-email">
            <span data-i18n="auth.rememberMe">จำอีเมลและรหัสผ่านไว้</span>
          </label>
          <a class="auth-forgot-link" id="auth-forgot-link" onclick="goForgotPassword()" data-i18n="auth.forgotPassword">ลืมรหัสผ่าน?</a>
        </div>

        <button type="submit" class="btn-primary" id="auth-submit-btn" style="width:100%; justify-content:center; margin-top:16px;" data-i18n="nav.login">เข้าสู่ระบบ</button>
      </form>

      <!-- ลืมรหัสผ่าน: กรอกอีเมลเพื่อขอลิงก์รีเซ็ต -->
      <form id="auth-forgot-form" style="display:none;" onsubmit="handleForgotPasswordSubmit(event)">
        <div class="auth-field">
          <label for="auth-forgot-email" data-i18n="auth.emailLabel">อีเมล</label>
          <input type="email" id="auth-forgot-email" placeholder="you@example.com" autocomplete="username">
        </div>
        <button type="submit" class="btn-primary" id="auth-forgot-btn" style="width:100%; justify-content:center; margin-top:16px;" data-i18n="auth.sendResetBtn">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
        <p class="auth-toggle"><a onclick="backToLogin()" data-i18n="auth.backToLogin">กลับไปเข้าสู่ระบบ</a></p>
      </form>

      <!-- ตั้งรหัสผ่านใหม่: เปิดจากลิงก์ในอีเมลเท่านั้น -->
      <form id="auth-reset-form" style="display:none;" onsubmit="handleResetPasswordSubmit(event)">
        <div class="auth-field">
          <label for="auth-reset-password" data-i18n="auth.newPasswordLabel">รหัสผ่านใหม่</label>
          <div class="auth-password-wrap">
            <input type="password" id="auth-reset-password" data-i18n-placeholder="auth.passwordPlaceholder" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password">
            <button type="button" class="auth-toggle-pw" onclick="toggleAuthPasswordVisibility('auth-reset-password', this)" data-i18n-aria-label="auth.showPassword" aria-label="แสดงรหัสผ่าน" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="auth-field">
          <label for="auth-reset-password-confirm" data-i18n="auth.confirmPasswordLabel">ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="auth-reset-password-confirm" data-i18n-placeholder="auth.confirmPasswordPlaceholder" placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="auth-reset-btn" style="width:100%; justify-content:center; margin-top:16px;" data-i18n="auth.savePasswordBtn">บันทึกรหัสผ่านใหม่</button>
      </form>

      <p class="auth-toggle" id="auth-toggle-row"><span data-i18n="auth.noAccount">ยังไม่มีบัญชี?</span> <a onclick="toggleAuthMode()" data-i18n="auth.signupLink">สมัครสมาชิก</a></p>

      <div class="auth-guest-note" id="auth-guest-note">
        <span data-i18n="auth.guestNotePrefix">หรือ</span> <a onclick="goHome()" data-i18n="auth.guestContinueLink">ใช้งานแบบไม่ล็อกอินต่อไป</a> <span data-i18n="auth.guestNoteSuffix">— บันทึกจะเก็บไว้ในเครื่องนี้เท่านั้น</span>
      </div>
    </div>

<script>
let authMode = 'login'; // 'login' | 'signup' | 'forgot' | 'reset'

const AUTH_EYE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const AUTH_EYE_OFF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.6 21.6 0 015.06-6.06M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a21.6 21.6 0 01-2.61 3.68M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

// สลับ input password ระหว่างซ่อน/แสดงตัวอักษร (ไอคอนจะเปลี่ยนตามสถานะปัจจุบัน)
// ไม่ใส่ argument = ช่องรหัสผ่านของฟอร์มเข้าสู่ระบบ/สมัครสมาชิก (ของเดิม) — ใส่ inputId/btnEl เพื่อใช้กับฟอร์มอื่น เช่นตั้งรหัสผ่านใหม่
function toggleAuthPasswordVisibility(inputId, btnEl){
  const input = document.getElementById(inputId || 'auth-password');
  const btn = btnEl || document.getElementById('auth-toggle-pw-btn');
  if(!input || !btn) return;
  const willShow = input.type === 'password';
  input.type = willShow ? 'text' : 'password';
  btn.innerHTML = willShow ? AUTH_EYE_OFF_ICON : AUTH_EYE_ICON;
  btn.setAttribute('aria-pressed', String(willShow));
  btn.setAttribute('aria-label', willShow ? t('auth.hidePassword') : t('auth.showPassword'));
}

// ---- จำอีเมลไว้ในเครื่อง (localStorage) เพื่อไม่ต้องพิมพ์ใหม่ทุกครั้งที่เข้าหน้าล็อกอิน ----
const AUTH_REMEMBER_EMAIL_KEY = 'ace_tarot_remember_email';
function loadRememberedEmail(){
  try{ return localStorage.getItem(AUTH_REMEMBER_EMAIL_KEY) || ''; }catch(e){ return ''; }
}
function setRememberedEmail(email, remember){
  try{
    if(remember && email) localStorage.setItem(AUTH_REMEMBER_EMAIL_KEY, email);
    else localStorage.removeItem(AUTH_REMEMBER_EMAIL_KEY);
  }catch(e){ /* localStorage ใช้ไม่ได้ ก็แค่ไม่จำอีเมลข้ามเซสชัน */ }
}

function goAuth(){
  authMode = 'login';
  updateAuthUI();
  showScreen('auth');

  const remembered = loadRememberedEmail();
  const emailInput = document.getElementById('auth-email');
  const rememberCb = document.getElementById('auth-remember-email');
  if(emailInput) emailInput.value = remembered;
  if(rememberCb) rememberCb.checked = !!remembered;
}

function toggleAuthMode(){
  authMode = authMode === 'login' ? 'signup' : 'login';
  updateAuthUI();
}

// เปิดฟอร์ม "ลืมรหัสผ่าน" — เอาอีเมลที่พิมพ์ไว้ในฟอร์มเข้าสู่ระบบมาเติมให้เลยถ้ามี
function goForgotPassword(){
  authMode = 'forgot';
  updateAuthUI();
  const loginEmail = document.getElementById('auth-email');
  const forgotEmail = document.getElementById('auth-forgot-email');
  if(forgotEmail) forgotEmail.value = (loginEmail && loginEmail.value) || '';
}

function backToLogin(){
  authMode = 'login';
  updateAuthUI();
}

function updateAuthUI(){
  const title = document.getElementById('auth-title');
  const subtitle = document.getElementById('auth-subtitle');
  const btn = document.getElementById('auth-submit-btn');
  const toggleRow = document.getElementById('auth-toggle-row');
  const errEl = document.getElementById('auth-error');
  const pwInput = document.getElementById('auth-password');
  const loginForm = document.getElementById('auth-form');
  const forgotForm = document.getElementById('auth-forgot-form');
  const resetForm = document.getElementById('auth-reset-form');
  const guestNote = document.getElementById('auth-guest-note');
  if(!title) return; // partial ยังไม่โหลด
  if(errEl) errEl.style.display = 'none';

  const isLoginOrSignup = authMode === 'login' || authMode === 'signup';
  if(loginForm) loginForm.style.display = isLoginOrSignup ? '' : 'none';
  if(forgotForm) forgotForm.style.display = authMode === 'forgot' ? '' : 'none';
  if(resetForm) resetForm.style.display = authMode === 'reset' ? '' : 'none';
  if(toggleRow) toggleRow.style.display = isLoginOrSignup ? '' : 'none';
  if(guestNote) guestNote.style.display = authMode === 'reset' ? 'none' : '';

  if(authMode === 'login'){
    title.textContent = t('nav.login');
    subtitle.textContent = t('auth.loginSubtitle');
    btn.textContent = t('nav.login');
    toggleRow.innerHTML = `${t('auth.noAccount')} <a onclick="toggleAuthMode()">${t('auth.signupLink')}</a>`;
    if(pwInput) pwInput.autocomplete = 'current-password';
  } else if(authMode === 'signup'){
    title.textContent = t('auth.signupTitle');
    subtitle.textContent = t('auth.signupSubtitle');
    btn.textContent = t('auth.signupLink');
    toggleRow.innerHTML = `${t('auth.hasAccount')} <a onclick="toggleAuthMode()">${t('nav.login')}</a>`;
    if(pwInput) pwInput.autocomplete = 'new-password';
  } else if(authMode === 'forgot'){
    title.textContent = t('auth.forgotTitle');
    subtitle.textContent = t('auth.forgotSubtitle');
  } else if(authMode === 'reset'){
    title.textContent = t('auth.resetTitle');
    subtitle.textContent = t('auth.resetSubtitle');
  }
  renderEmailHistoryDatalist();
}

// ---- ประวัติอีเมลที่เคยใช้ล็อกอิน/สมัครบนเครื่องนี้ (ใช้ทำ autocomplete dropdown ในช่องอีเมล) ----
const AUTH_EMAIL_HISTORY_KEY = 'ace_tarot_email_history';
const AUTH_EMAIL_HISTORY_MAX = 5;

function loadEmailHistory(){
  try{
    const raw = localStorage.getItem(AUTH_EMAIL_HISTORY_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  }catch(e){ return []; }
}
function addToEmailHistory(email){
  if(!email) return;
  try{
    const list = loadEmailHistory().filter(e => e !== email);
    list.unshift(email);
    localStorage.setItem(AUTH_EMAIL_HISTORY_KEY, JSON.stringify(list.slice(0, AUTH_EMAIL_HISTORY_MAX)));
  }catch(e){ /* localStorage ใช้ไม่ได้ ก็แค่ไม่มี autocomplete ประวัติอีเมล */ }
}
function renderEmailHistoryDatalist(){
  const list = document.getElementById('auth-email-history');
  if(!list) return;
  list.innerHTML = loadEmailHistory().map(e => `<option value="${escapeHtml(e)}">`).join('');
}

// wrapper ของ <form onsubmit> — กัน reload หน้า แล้วค่อยยิง flow login/signup เดิม
function handleAuthFormSubmit(event){
  event.preventDefault();
  handleAuthSubmit();
}

function translateAuthError(msg){
  if(/Invalid login credentials/i.test(msg)) return t('auth.errInvalidCreds');
  if(/already registered|already exists|User already registered/i.test(msg)) return t('auth.errAlreadyRegistered');
  if(/Password should be at least/i.test(msg)) return t('auth.errPasswordMin');
  if(/Unable to validate email/i.test(msg)) return t('auth.errInvalidEmail');
  if(/Auth session missing|session.*expired|invalid.*token/i.test(msg)) return t('auth.errExpiredLink');
  return msg;
}

async function handleAuthSubmit(){
  if(typeof supabaseClient === 'undefined' || !supabaseClient){
    const errEl = document.getElementById('auth-error');
    errEl.style.color = '#E05C5C';
    errEl.textContent = t('auth.errNotReady');
    errEl.style.display = 'block';
    return;
  }

  const email = (document.getElementById('auth-email').value || '').trim();
  const password = document.getElementById('auth-password').value || '';
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-submit-btn');
  errEl.style.display = 'none';

  if(!email || !password){
    errEl.style.color = '#E05C5C';
    errEl.textContent = t('auth.errFillBoth');
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = t('auth.processing');

  try{
    let result;
    if(authMode === 'login'){
      result = await supabaseClient.auth.signInWithPassword({ email, password });
    } else {
      result = await supabaseClient.auth.signUp({ email, password });
    }
    if(result.error) throw result.error;

    const rememberCb = document.getElementById('auth-remember-email');
    setRememberedEmail(email, rememberCb ? rememberCb.checked : false);
    addToEmailHistory(email);

    // Supabase บางโปรเจกต์เปิด "ยืนยันอีเมล" ไว้ — ถ้าสมัครแล้วยังไม่มี session แปลว่าต้องยืนยันอีเมลก่อน
    if(authMode === 'signup' && !result.data.session){
      errEl.style.color = '#3FA66B';
      errEl.textContent = t('auth.signupSuccessConfirmEmail');
      errEl.style.display = 'block';
      return;
    }

    await onAuthSuccess();
  }catch(err){
    errEl.style.color = '#E05C5C';
    errEl.textContent = translateAuthError(err.message || t('auth.genericError'));
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

// ส่งอีเมลลิงก์รีเซ็ตรหัสผ่าน — Supabase จะไม่บอกว่าอีเมลนี้มีบัญชีอยู่จริงไหม (กันคนสุ่มเช็คว่าใครสมัครสมาชิกไว้บ้าง)
// เลยแสดงข้อความสำเร็จแบบเดียวกันเสมอไม่ว่าอีเมลจะมีอยู่จริงหรือไม่
async function handleForgotPasswordSubmit(event){
  event.preventDefault();
  if(typeof supabaseClient === 'undefined' || !supabaseClient){
    const errEl = document.getElementById('auth-error');
    errEl.style.color = '#E05C5C';
    errEl.textContent = t('auth.errNotReady');
    errEl.style.display = 'block';
    return;
  }

  const email = (document.getElementById('auth-forgot-email').value || '').trim();
  const errEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-forgot-btn');
  errEl.style.display = 'none';

  if(!email){
    errEl.style.color = '#E05C5C';
    errEl.textContent = t('auth.errFillEmail');
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = t('auth.sending');

  try{
    // redirectTo กลับมาที่หน้าแรกของเว็บนี้ — Supabase client จะตรวจจับ token ในลิงก์ที่คลิกมาเอง
    // แล้วยิง event 'PASSWORD_RECOVERY' ให้ (ดักฟังไว้ที่ setupPasswordRecoveryListener ใน app.js)
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
    if(error) throw error;
    errEl.style.color = '#3FA66B';
    errEl.textContent = t('auth.resetEmailSent');
    errEl.style.display = 'block';
  }catch(err){
    errEl.style.color = '#E05C5C';
    errEl.textContent = translateAuthError(err.message || t('auth.genericError'));
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

// ตั้งรหัสผ่านใหม่ — ใช้ได้เฉพาะตอนมี recovery session จากลิงก์ในอีเมลเท่านั้น (ดู setupPasswordRecoveryListener ใน app.js)
async function handleResetPasswordSubmit(event){
  event.preventDefault();
  const errEl = document.getElementById('auth-error');
  const newPassword = document.getElementById('auth-reset-password').value || '';
  const confirmPassword = document.getElementById('auth-reset-password-confirm').value || '';
  const btn = document.getElementById('auth-reset-btn');
  errEl.style.display = 'none';

  if(!newPassword || newPassword.length < 6){
    errEl.style.color = '#E05C5C';
    errEl.textContent = t('auth.errPasswordMin');
    errEl.style.display = 'block';
    return;
  }
  if(newPassword !== confirmPassword){
    errEl.style.color = '#E05C5C';
    errEl.textContent = t('auth.errPasswordMismatch');
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = t('auth.saving');

  try{
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    if(error) throw error;
    errEl.style.color = '#3FA66B';
    errEl.textContent = t('auth.resetSuccess');
    errEl.style.display = 'block';
    await onAuthSuccess();
  }catch(err){
    errEl.style.color = '#E05C5C';
    errEl.textContent = translateAuthError(err.message || t('auth.genericError'));
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function onAuthSuccess(){
  const user = await getCurrentUser(); // ดึงครั้งเดียวแล้วส่งต่อ กันแต่ละฟังก์ชันด้านล่าง getSession() ซ้ำ
  await migrateAllGuestStateIfNeeded(user);
  await updateNavAuthUI(user);
  await renderCoinBadge(user);
  goHome();
}

async function handleLogout(){
  if(typeof supabaseClient !== 'undefined' && supabaseClient){
    await supabaseClient.auth.signOut();
  }
  await updateNavAuthUI();
  await renderCoinBadge();
  goHome();
}

// อัปเดตแถบ nav ด้านบนขวา: แสดงปุ่ม "เข้าสู่ระบบ" ถ้ายังไม่ล็อกอิน หรือปุ่มโปรไฟล์ (avatar) แบบเปิดเมนูย่อยถ้าล็อกอินอยู่
// รวม "ชื่อผู้ใช้ + Admin + ออกจากระบบ" ที่เดิมแยกเป็น 3 ปุ่ม/ข้อความคนละจุดในแถบบน ไว้ในเมนูเดียว
// (เหตุผลเดียวกับที่ทำ handleMobileProfileTap() ไว้แล้วสำหรับมือถือ — ลดความรกตอนแถบบนมีปุ่มนำทางเพิ่มขึ้น)
async function updateNavAuthUI(user){
  const area = document.getElementById('nav-auth-area');
  if(!area) return;
  const tt = (typeof t === 'function') ? t : (k => k);
  if(user === undefined) user = await getCurrentUser();
  if(user){
    const nickname = (user.user_metadata && user.user_metadata.nickname) || '';
    const displayName = nickname || user.email;
    const initial = displayName.trim().charAt(0).toUpperCase() || '?';
    const isAdmin = (typeof checkIsAdmin === 'function') ? await checkIsAdmin() : false;
    area.innerHTML = `
      <div class="nav-profile-area" id="nav-profile-area">
        <button class="nav-profile-btn" id="nav-profile-btn" onclick="toggleDesktopProfilePanel(event)" aria-haspopup="true" title="${escapeHtml(displayName)}">
          <span class="nav-profile-avatar">${escapeHtml(initial)}</span>
          <svg class="nav-profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="nav-profile-panel" id="nav-profile-panel">
          <div class="nav-profile-name" title="${escapeHtml(user.email)}">${escapeHtml(displayName)}</div>
          ${isAdmin && typeof goAdmin === 'function' ? `<button class="nav-profile-item" onclick="closeDesktopProfilePanel(); goAdmin();">Admin Dashboard</button>` : ''}
          <button class="nav-profile-item danger" onclick="closeDesktopProfilePanel(); handleLogout();">${tt('nav.logout')}</button>
        </div>
      </div>
    `;
  } else {
    area.innerHTML = `<button class="nav-btn nav-btn-highlight" onclick="goAuth()">${tt('nav.login')}</button>`;
  }
  if(typeof updateMobileProfileTab === 'function') updateMobileProfileTab(user);
}

/* ---------------- Guest -> Signed-in migration (เครื่องมือกลาง) ---------------- */
// ทุกฟีเจอร์ที่มีข้อมูลแบบ guest (localStorage) ต้องย้ายเข้าบัญชีตอนล็อกอินครั้งแรก ใช้ descriptor
// ในลิสต์นี้ร่วมกัน แทนการเขียนฟังก์ชัน migrate*IfNeeded แยกทุกครั้ง — ฟีเจอร์ใหม่แค่เพิ่ม descriptor พอ
// แต่ละ descriptor มี:
//   getLocal()            คืนค่า/ลิสต์แบบ guest ที่เก็บไว้ในเครื่องนี้
//   isEmpty(local)         true ถ้าไม่มีอะไรต้องย้าย (ข้ามทั้ง descriptor)
//   skip(user)             true ถ้าไม่ควรย้ายทับ (เช่น remote มีค่าอยู่แล้ว) — readings ไม่มีแนวคิดนี้เลยคืน false เสมอ
//   migrate(user, local, context)  ทำการย้ายจริง คืนค่าอะไรก็ได้ที่ descriptor อื่นอาจต้องใช้ต่อ (เก็บใน context)
//   clearLocal()           ล้างข้อมูล guest ในเครื่องหลังย้าย (ไม่ว่าจะ skip หรือย้ายสำเร็จก็ตาม)
//   confirmMessage(local)  ถ้ามี: ข้อความถามยืนยันก่อนย้าย (ไม่ระบุ = ย้ายเงียบๆ ไม่ต้องถาม)
//   onDone(local, result)  ถ้ามี: เรียกหลังย้ายสำเร็จ (เช่นแจ้งผลด้วย alert)
const GUEST_MIGRATIONS = [
  {
    name: 'readings',
    getLocal: () => loadJournalLocal(),
    isEmpty: (list) => !list.length,
    skip: async () => false, // readings เป็นลิสต์ที่โตขึ้นเรื่อยๆ ไม่เช็คว่า remote มีอยู่แล้วเหมือน nickname/dailyState
    migrate: async (user, list) => {
      let migrated = 0;
      const idMap = {}; // localEntryId -> remoteReadingId ให้ descriptor 'dailyState' ใช้ map entryId ต่อ
      for(const entry of list){
        const { data, error } = await supabaseClient.from('readings').insert(entryToRow(entry, user.id)).select('id').single();
        if(!error && data){ migrated++; idMap[entry._id] = data.id; }
      }
      return { migrated, total: list.length, idMap };
    },
    clearLocal: () => saveJournalListLocal([]),
    confirmMessage: (list) => t('auth.migrateConfirm', {n: list.length}),
    onDone: (list, result) => alert(t('auth.migrateDone', {migrated: result.migrated, total: result.total}))
  },
  {
    name: 'nickname',
    getLocal: () => getLocalNickname(),
    isEmpty: (name) => !name,
    skip: async (user) => !!(user.user_metadata && user.user_metadata.nickname), // ไม่ทับชื่อเล่นเดิมจากอุปกรณ์อื่น
    migrate: async (user, name) => { await saveNickname(name); },
    clearLocal: () => setLocalNickname('')
  },
  {
    name: 'dailyState',
    getLocal: () => getDailyStateLocal(),
    isEmpty: (state) => !state.lastDate,
    skip: async (user) => !!(await getDailyStateRemote(user.id)).lastDate, // ไม่ทับ streak เดิมจากอุปกรณ์อื่น
    migrate: async (user, local, context) => {
      // entryId เดิมเป็น id แบบ local ไม่ใช่ uuid — map ผ่าน idMap ที่ descriptor 'readings' ย้ายไว้ก่อนหน้า (ถ้ามี)
      const readingsResult = context.readings;
      const migratedEntryId = (readingsResult && readingsResult.idMap && local.entryId) ? (readingsResult.idMap[local.entryId] || null) : null;
      await saveDailyStateRemote(user.id, { lastDate: local.lastDate, streak: local.streak, entryId: migratedEntryId });
    },
    clearLocal: () => saveDailyStateLocal({ lastDate: null, streak: 0, entryId: null })
  }
];

async function runGuestMigration(descriptor, user, context){
  const local = descriptor.getLocal();
  if(descriptor.isEmpty(local)) return context;
  if(descriptor.confirmMessage && !confirm(descriptor.confirmMessage(local))) return context;

  if(!(await descriptor.skip(user))){
    const result = await descriptor.migrate(user, local, context);
    context = { ...context, [descriptor.name]: result };
    // เคลียร์ข้อมูล local ก่อนเรียก onDone() เสมอ เพราะ onDone อาจเป็น alert() ที่บล็อก thread ค้างไว้
    // (ถ้าเคลียร์หลัง แล้วผู้ใช้ปิดแท็บตอน alert ค้างอยู่ ข้อมูลที่ย้ายไปแล้วจะไม่ถูกลบ เสี่ยงย้ายซ้ำรอบหน้า)
    descriptor.clearLocal();
    if(descriptor.onDone) descriptor.onDone(local, result);
    return context;
  }
  descriptor.clearLocal();
  return context;
}

// เรียกครั้งเดียวตอนล็อกอิน/สมัครสำเร็จ — รันทุก descriptor ใน GUEST_MIGRATIONS ตามลำดับ
async function migrateAllGuestStateIfNeeded(user){
  if(!user) return {}; // กันกรณี getCurrentUser() ยังไม่ resolve session ทัน (เคยมี guard นี้ในฟังก์ชันเดิมทุกตัวก่อนรวมเป็น engine เดียว)
  let context = {};
  for(const descriptor of GUEST_MIGRATIONS){
    context = await runGuestMigration(descriptor, user, context);
  }
  return context;
}
</script>
