// เรียกใช้รูปไพ่จาก Wikimedia Commons — ใช้ร่วมกันทั้งการอ่านไพ่ปกติและ "ภาพรวม 1 เดือน"

function renderResult(entry){

  // ใน server.js สาขา spread==='monthly') เลยต้องแยกไปเรนเดอร์คนละฟังก์ชัน ไม่ใช้ฟิลด์ร่วมกับโหมดถาม-ตอบปกติ

    <div class="position-section">
      <h3>${t('result.positionByPosition')} (${s.label} · ${s.sub})</h3>

    <div class="closing-quote">

// ---- "ภาพรวม 1 เดือน" — โครงสร้างผลลัพธ์: monthly_theme / areas (overall,career,finance,love,health แต่ละอันมี
// reading+advice) / opportunities[] / warnings[] / key_message / rating (1-5 ต่อด้าน) ดู server.js สาขา spread==='monthly'
const MONTHLY_AREA_META = {
  overall: { icon: '☾' },
  career: { icon: '⚒' },
  finance: { icon: '฿' },
  love: { icon: '♥' },
  health: { icon: '✚' }
};
const MONTHLY_AREA_ORDER = ['overall', 'career', 'finance', 'love', 'health'];
function monthlyAreaLabel(key){ return t('result.area.' + key); }

function renderMonthlyStars(rating){
  const n = Math.max(0, Math.min(5, Math.round(Number(rating)) || 0));
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function buildMonthlyAreaCardsHtml(summary){
  const areas = summary.areas || {};
  const ratings = summary.rating || {};
  return MONTHLY_AREA_ORDER.map(key => {
    const meta = MONTHLY_AREA_META[key];
    const a = areas[key] || {};
    const hasRating = ratings[key] !== undefined && ratings[key] !== null;
    return `
      <div class="area-card ${key === 'overall' ? 'area-overall' : ''}">
        <div class="ac-head">
          <div class="ac-title"><span class="cicon">${meta.icon}</span> ${monthlyAreaLabel(key)}</div>
          ${hasRating ? `<div class="ac-stars">${renderMonthlyStars(ratings[key])}</div>` : ''}
        </div>
        <p>${escapeHtml(a.reading) || '-'}</p>
        ${a.advice ? `<div class="ac-advice"><b>${t('result.adviceLabel')}</b> ${escapeHtml(a.advice)}</div>` : ''}
      </div>`;
  }).join('');
}

function buildMonthlyOppWarnHtml(summary){
  const opportunities = Array.isArray(summary.opportunities) ? summary.opportunities : [];
  const warnings = Array.isArray(summary.warnings) ? summary.warnings : [];
  if(!opportunities.length && !warnings.length) return '';
  const oppHtml = opportunities.length ? `
      <div class="rblock">
        <div class="rb-title">${iconSvgSmall()} ${t('result.opportunities')}</div>
        <ul class="action-list-styled">${opportunities.map(o => `<li>${escapeHtml(o)}</li>`).join('')}</ul>

  const warnHtml = warnings.length ? `
      <div class="rblock">
        <div class="rb-title">${iconSvgSmall()} ${t('result.warnings')}</div>
        <ul class="warning-list">${warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('')}</ul>
      </div>` : '';
  return `<div class="opp-warn-grid">${oppHtml}${warnHtml}</div>`;

function renderMonthlyOverviewResult(entry){
  const s = getSpreadInfo(entry);
  const summary = entry.summary || {};
  const theme = summary.monthly_theme || {};
  const catInfo = CATEGORIES.find(c => c.key === entry.category) || CATEGORIES[0];

  document.getElementById('result-content').innerHTML = `
    ${buildResultHeaderHtml(entry, s, catInfo, true)}

    <div class="monthly-hero">
      <h2 class="mh-title">${escapeHtml(theme.title) || t('result.defaultMonthlyTitle')}</h2>
      <p class="mh-summary">${escapeHtml(theme.summary) || '-'}</p>

    </div>

    <div class="area-grid">${buildMonthlyAreaCardsHtml(summary)}</div>

    ${buildMonthlyOppWarnHtml(summary)}

    <div class="closing-quote">
      <p>${escapeHtml(summary.key_message) || t('result.defaultMonthlyClosing')}</p>

function renderFollowupsHtml(entry){
  const list = Array.isArray(entry.followups) ? entry.followups : [];
  return list.map(f => `
    <div class="fu-item">
      <div class="fu-q">${escapeHtml(f.question)}</div>
      <div class="fu-a"><span class="fu-label">Ace of Tarot</span>${escapeHtml(f.answer)}</div>
    </div>`).join('');
}

/* ---------------- Export / Share ผลลัพธ์ ---------------- */
async function submitFollowup(){
  const ta = document.getElementById('followup-input');
  const btn = document.getElementById('followup-btn');
  const statusEl = document.getElementById('fu-status');
  const followupQuestion = (ta.value || '').trim();

  if(!followupQuestion){
    statusEl.innerHTML = `<div class="fu-error">${t('result.followupPrompt')}</div>`;
    return;
  }

  const entry = state.currentReading;
  if(!entry){ return; }

  btn.disabled = true;
  ta.disabled = true;
  statusEl.innerHTML = `<div class="fu-loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> ${t('result.followupLoading')}</div>`;

  try{
    const response = await fetch('/api/followup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: entry.question,
        followupQuestion,
        spread: entry.spreadBackend || SPREAD_BACKEND_MAP[entry.spreadKey] || 'three',
        category: entry.category || 'ทั่วไป',
        cards: entry.cards.map(c => ({ name: c.name, position: c.position, isReversed: !!c.reversed })),
        lang: getLang()
      })
    });

    const data = await response.json();
    if(!response.ok || !data.success || !data.answer){
      throw new Error(data.error || t('result.followupError'));
    }

    if(!Array.isArray(entry.followups)) entry.followups = [];
    entry.followups.push({ question: followupQuestion, answer: data.answer, date: new Date().toISOString() });

    await persistReading(entry, true);
    ta.value = '';
    ta.style.height = 'auto';
    statusEl.innerHTML = '';
    document.getElementById('fu-thread').innerHTML = renderFollowupsHtml(entry);
  }catch(err){
    console.error('Followup error:', err);
    statusEl.innerHTML = `<div class="fu-error">${escapeHtml(err.message)}</div>`;
  }finally{
    btn.disabled = false;
    ta.disabled = false;
  }
}

// วาดการ์ดสรุปผลทำนายด้วย Canvas API ล้วนๆ (ไม่พึ่ง library ภายนอก) — โค้ดเก่าที่ไม่มีใครเรียกใช้แล้ว
// (ถูกแทนที่ด้วย buildShareCardElement/renderShareCardToBlob แบบ html2canvas ด้านล่าง) เก็บไว้เฉยๆ ไม่ได้ลบ
function wrapCanvasText(ctx, text, x, startY, maxWidth, lineHeight){
  let line = '';
  let y = startY;
  for(let i = 0; i < text.length; i++){
    const testLine = line + text[i];
    if(ctx.measureText(testLine).width > maxWidth && line.length > 0){
      ctx.fillText(line, x, y);
      line = text[i];
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  if(line){ ctx.fillText(line, x, y); y += lineHeight; }
  return y;
}

function buildShareCanvas(entry){
  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // พื้นหลังไล่สีม่วง (โทนเดียวกับธีมแอป)
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#8C67B4');
  grad.addColorStop(1, '#5B3E80');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // กรอบทอง
  ctx.strokeStyle = 'rgba(201,164,103,0.9)';
  ctx.lineWidth = 4;
  ctx.strokeRect(28, 28, W - 56, H - 56);

  ctx.textAlign = 'center';

  // แบรนด์
  ctx.fillStyle = '#F5E9D6';
  ctx.font = '600 44px Georgia, "Cormorant Garamond", serif';
  ctx.fillText('✦ Ace of Tarot ✦', W / 2, 140);

  ctx.font = '300 22px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('Same Cards. New Perspectives. A Brighter You.', W / 2, 178);

  // คำถาม
  let y = 270;
  ctx.font = 'italic 36px Georgia, serif';
  ctx.fillStyle = '#FFFFFF';
  y = wrapCanvasText(ctx, `"${entry.question}"`, W / 2, y, W - 160, 48);

  y += 36;
  ctx.strokeStyle = 'rgba(201,164,103,0.6)';
  ctx.beginPath(); ctx.moveTo(W / 2 - 80, y); ctx.lineTo(W / 2 + 80, y); ctx.stroke();
  y += 60;

  // รายชื่อไพ่ที่จับได้
  ctx.font = '600 30px Arial, sans-serif';
  ctx.fillStyle = '#E7D3AC';
  entry.cards.forEach(c => {
    const line = `${c.position}: ${c.name}${c.reversed ? ' (กลับหัว)' : ''}`;
    y = wrapCanvasText(ctx, line, W / 2, y, W - 160, 40);
  });

  y += 26;
  ctx.strokeStyle = 'rgba(201,164,103,0.6)';
  ctx.beginPath(); ctx.moveTo(W / 2 - 80, y); ctx.lineTo(W / 2 + 80, y); ctx.stroke();
  y += 60;

  // ข้อคิดปิดท้าย
  const rawAnswer = (entry.summary && entry.summary.answer) || '';
  const answer = rawAnswer.replace(/^[""]|[""]$/g, '');
  if(answer){
    ctx.font = '300 28px Georgia, serif';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    wrapCanvasText(ctx, answer, W / 2, y, W - 180, 40);
  }

  // footer
  ctx.font = '300 20px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('Ace of Tarot', W / 2, H - 60);

  return canvas;
}

async function shareOrDownloadResult(btn){
  const entry = state.currentReading;
  if(!entry) return;

  const originalLabel = btn ? btn.innerHTML : null;
  if(btn){ btn.disabled = true; btn.innerHTML = 'กำลังสร้างรูปภาพ...'; }

  try{
    const canvas = buildShareCanvas(entry);
    canvas.toBlob(async (blob) => {
      if(btn){ btn.disabled = false; btn.innerHTML = originalLabel; }
      if(!blob) return;

      const fileName = `ace-of-tarot-${Date.now()}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });

      // ถ้าอุปกรณ์รองรับ Web Share API แบบแนบไฟล์ (ส่วนใหญ่คือมือถือ) ให้เปิด share sheet ของระบบ
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({
            files: [file],
            title: 'Ace of Tarot',
            text: `ผลทำนายไพ่ทาโรต์ของฉัน: "${entry.question}"`
          });
          return;
        }catch(err){
          if(err && err.name === 'AbortError') return; // ผู้ใช้กดยกเลิกการแชร์เอง
          console.warn('แชร์ไม่สำเร็จ, จะดาวน์โหลดไฟล์แทน', err);
        }
      }

      // ไม่รองรับ Web Share API (เช่นเดสก์ท็อป) หรือแชร์ล้มเหลว -> ดาวน์โหลดไฟล์ภาพโดยตรงแทน
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  }catch(err){
    console.error('สร้างรูปภาพสำหรับแชร์ล้มเหลว', err);
    if(btn){ btn.disabled = false; btn.innerHTML = originalLabel; }
  }
}

// สร้าง element การ์ดสรุปผลแบบสวยงาม (แยกจากหน้าผลลัพธ์เต็มซึ่งยาวเกินจะแคปเป็นรูปได้)
// ไว้นอกจอ (position:fixed; left:-9999px) เพื่อให้ html2canvas capture ได้โดยไม่รบกวนสายตาผู้ใช้
function buildShareCardElement(entry){
  const s = getSpreadInfo(entry);
  const catInfo = CATEGORIES.find(c => c.key === entry.category) || CATEGORIES[0];
  const summary = entry.summary || {};
  // "ภาพรวม 1 เดือน" ใช้ฟิลด์ monthly_theme/key_message แทน question/answer ปกติ (ดู server.js สาขา spread==='monthly')
  const premiumInfo = SPREAD_CATALOG_SAFE.PREMIUM_READINGS[entry.spreadKey];
  const isOverviewReading = !!(premiumInfo && premiumInfo.skipQuestion);
  const theme = summary.monthly_theme || {};
  const closing = isOverviewReading
    ? (summary.key_message || t('result.defaultMonthlyClosing'))
    : (summary.answer || t('result.defaultClosingQuote'));
  const dateStr = (() => {
    try{ return new Date(entry.date || Date.now()).toLocaleDateString(isEnglish() ? 'en-US' : 'th-TH', { day:'numeric', month:'long', year:'numeric' }); }
    catch(e){ return ''; }
  })();

  // ปรับขนาดรูปไพ่ตามจำนวนไพ่ในชุด เพื่อให้ชุดใหญ่ (เช่น Celtic Cross 10 ใบ) ยังพอดีแถวเดียว
  const count = entry.cards.length;
  const cardW = count <= 3 ? 122 : count <= 5 ? 96 : count <= 6 ? 84 : 58;
  const nameFont = count <= 6 ? '.68rem' : '.56rem';

  const cardsHtml = entry.cards.map(c => {
    const cardImgUrl = getCardImageUrl(c);
    return `
      <div style="display:flex; flex-direction:column; align-items:center; width:${cardW}px;">
        <div style="width:${cardW}px; height:${Math.round(cardW * 1.52)}px; border-radius:8px; overflow:hidden; border:2px solid #C9A467; box-shadow:0 10px 22px -10px rgba(91,62,128,.35); ${c.reversed ? 'transform:rotate(180deg);' : ''}">
          <img src="${cardImgUrl}" onerror="handleCardImgError(this)" style="width:100%; height:100%; object-fit:fill; display:block;">
        </div>
        <div style="margin-top:8px; font-size:${nameFont}; color:#5B3E80; text-align:center; line-height:1.4; max-width:${cardW + 14}px;">${escapeHtml(c.name)}${c.reversed ? '<br>(' + t('result.reversed') + ')' : ''}</div>
      </div>`;

// รอให้รูปไพ่ทุกใบในการ์ดโหลดเสร็จ (หรือ error/fallback เสร็จ) ก่อนแคปเป็นรูป
// กันปัญหา html2canvas แคปรูปไปตอนที่ไพ่บางใบยังโหลดไม่เสร็จ กลายเป็นช่องว่าง
function waitForImages(el){
  const imgs = Array.from(el.querySelectorAll('img'));
  return Promise.all(imgs.map(img => {
    if(img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.addEventListener('load', resolve, { once: true });
      img.addEventListener('error', resolve, { once: true });
    });
  }));
}

// แปลงการ์ดสรุปผลเป็น canvas ผ่าน html2canvas — ใช้ร่วมกันทั้งแชร์เป็นรูป (blob) และส่งออกเป็น PDF
async function renderShareCardToCanvas(entry){
  if(typeof html2canvas === 'undefined'){
    console.error('html2canvas ยังไม่โหลด');
    return null;
  }
  const el = buildShareCardElement(entry);
  try{
    await waitForImages(el);
    return await html2canvas(el, { backgroundColor: null, scale: 2, useCORS: true });
  }finally{
    el.remove();
  }
}

// แปลงการ์ดสรุปผลเป็น Blob รูปภาพ (PNG) — คืนค่าเป็น Promise<Blob|null>
async function renderShareCardToBlob(entry){
  const canvas = await renderShareCardToCanvas(entry);
  if(!canvas) return null;
  return await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function exportResultAsImage(){
  const entry = state.currentReading;
  if(!entry) return;
  const btn = document.getElementById('btn-save-img');
  if(btn) btn.classList.add('is-busy');
  try{
    const blob = await renderShareCardToBlob(entry);
    if(!blob){
      alert(t('result.imageGenError'));
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ace-of-tarot-${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }finally{
    if(btn) btn.classList.remove('is-busy');
  }
}

function truncateText(str, maxLen){

  return s.length > maxLen ? s.slice(0, maxLen - 1).trim() + '…' : s;

    <div style="position:relative; width:100%; height:100%; background:#5B3E80; background-image:radial-gradient(circle at 30% 15%, rgba(255,255,255,.18), transparent 45%), linear-gradient(155deg, #9A78BD 0%, #8C67B4 38%, #5B3E80 75%, #47315F 100%);">

// บันทึก/แชร์ภาพ IG Story — เว็บไซต์ธรรมดาไม่มีทาง "โพสต์ลง Story ตรงๆ" ได้เลย (ต้องผ่านแอป Instagram
// เท่านั้น ไม่มี API สาธารณะให้เว็บเรียก) ทำได้ดีที่สุดคือส่งภาพที่ขนาด/สัดส่วนถูกต้องเป๊ะให้ผู้ใช้ผ่าน
// share sheet ของระบบ (บนมือถือส่วนใหญ่ Instagram จะโผล่เป็นตัวเลือกให้กดแชร์ต่อเข้า Story ได้เลย)
// หรือดาวน์โหลดไฟล์ไว้แล้วผู้ใช้ไปเลือกเองในแอป Instagram
async function shareIgStory(){
  const entry = state.currentReading;
  if(!entry) return;
  const btn = document.getElementById('btn-ig-story');
  if(btn) btn.classList.add('is-busy');
  try{
    const blob = await renderIgStoryCardToBlob(entry);
    if(!blob){
      alert(t('result.imageGenError'));
      return;
    }
    const fileName = `ace-of-tarot-story-${Date.now()}.png`;
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], title: 'Ace of Tarot' });
        return;
      }catch(err){
        if(err && err.name === 'AbortError') return;
        console.warn('แชร์ไม่สำเร็จ, จะดาวน์โหลดไฟล์แทน', err);
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    if(!navigator.canShare){
      alert(t('result.igStorySavedAlert'));
    }
  }catch(err){
    console.error('สร้างภาพ IG Story ไม่สำเร็จ', err);
    alert(t('result.imageGenError'));
  }finally{
    if(btn) btn.classList.remove('is-busy');
  }
}

        `<p style="margin:0; font-size:.88rem; line-height:1.8; color:#3A2E4D;">${escapeHtml(a.reading) || '-'}</p>` +
        (a.advice ? `<p style="margin:10px 0 0; padding-top:10px; border-top:1px dashed rgba(140,103,180,.25); font-size:.82rem; color:#5B3E80;"><b>${t('result.adviceLabel')}</b> ${escapeHtml(a.advice)}</p>` : '')
      );
    }).join('')}
    ${(Array.isArray(summary.opportunities) && summary.opportunities.length) ? sectionBlock(t('result.opportunities'),
      '<ul style="margin:0; padding-left:20px; font-size:.88rem; line-height:1.9; color:#3A2E4D;">' + summary.opportunities.map(o => `<li>${escapeHtml(o)}</li>`).join('') + '</ul>') : ''}
    ${(Array.isArray(summary.warnings) && summary.warnings.length) ? sectionBlock(t('result.warnings'),
      '<ul style="margin:0; padding-left:20px; font-size:.88rem; line-height:1.9; color:#3A2E4D;">' + summary.warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('') + '</ul>') : ''}
  ` : `
    ${sectionBlock(t('result.overview'), `<p style="margin:0; font-size:.88rem; line-height:1.8; color:#3A2E4D;">${escapeHtml(summary.overview) || '-'}</p>`)}
    ${sectionBlock(t('result.guidance'), `<p style="margin:0; font-size:.88rem; line-height:1.8; color:#3A2E4D;">${escapeHtml(summary.guidance) || '-'}</p>`)}
    ${focusSectionHtml}
    ${sectionBlock(t('result.actionPlan'), actionItemsHtml)}

    <div style="margin-top:26px;">
      <div style="font-family:'Cormorant Garamond',serif; font-size:1.15rem; color:#5B3E80; margin-bottom:4px;">${t('result.positionByPosition')}</div>
      <div style="font-size:.76rem; color:#9A8AB3; margin-bottom:10px;">${escapeHtml(s.label)} · ${escapeHtml(s.sub)}</div>
      <div style="background:#fff; border:1px solid rgba(140,103,180,.2); border-radius:14px; padding:6px 24px;">${positionBlocksHtml}</div>
    </div>
  `;
  const closingHtml = isOverviewReading
    ? (summary.key_message || t('result.defaultMonthlyClosing'))
    : (summary.answer || t('result.defaultClosingQuote'));

  const el = document.createElement('div');
  el.style.cssText = `position:fixed; left:-9999px; top:0; width:760px; background:#FDF6F0; font-family:'Prompt', sans-serif; color:#3A2E4D; padding:44px 40px;`;
  el.innerHTML = `
    <div style="text-align:center; font-family:'Cormorant Garamond',serif; font-size:1.2rem; letter-spacing:.24em; text-transform:uppercase; color:#B4894F;">✦ ${t('result.aceOfTarot')} ✦</div>

    <div style="display:flex; justify-content:center; gap:9px; flex-wrap:wrap; margin-top:16px;">
      ${badge(catInfo.icon + ' ' + escapeHtml(categoryLabel(catInfo.key)))}
      ${badge(escapeHtml(s.label) + ' · ' + escapeHtml(s.sub))}
      ${dateStr ? badge(escapeHtml(dateStr)) : ''}
    </div>

    <div style="background:#fff; border:1px solid rgba(140,103,180,.3); border-radius:16px; padding:22px 26px; margin-top:22px;">
      <div style="font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:#8C67B4; margin-bottom:8px;">${isOverviewReading ? t('result.monthlyOverview') : t('result.question')}</div>
      <div style="font-family:'Cormorant Garamond',serif; font-size:1.3rem; line-height:1.6; color:#3A2E4D;">${isOverviewReading ? escapeHtml(theme.title || entry.question) : '"' + escapeHtml(entry.question) + '"'}</div>
      ${isOverviewReading && theme.summary ? `<div style="margin-top:10px; font-size:.85rem; line-height:1.7; color:#5B3E80;">${escapeHtml(theme.summary)}</div>` : ''}
    </div>

    <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:24px;">${cardsHtml}</div>

    ${bodyHtml}

    <div style="background:rgba(255,255,255,.9); border-left:3px solid #C9A467; border-radius:12px; padding:22px 26px; margin-top:24px;">
      <div style="font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.05rem; line-height:1.7; color:#3A2E4D;">${escapeHtml(closingHtml)}</div>
      <div style="text-align:right; margin-top:10px; font-size:.8rem; color:#9A8AB3;">— ${t('result.aceOfTarot')}</div>
    </div>

    <div style="text-align:center; margin-top:30px; padding-top:18px; border-top:1px solid rgba(140,103,180,.2);">
      <div style="font-size:.74rem; color:#5B3E80;">Same Cards. New Perspectives. A Brighter You.</div>
      <div style="font-size:.68rem; color:#B4894F; margin-top:4px;">${escapeHtml(location.host)}</div>
    </div>
  `;
  document.body.appendChild(el);
  return el;
}

// ตัดภาพยาวๆ (เช่นรายงานคำทำนายฉบับเต็ม) ออกเป็นหลายหน้าใส่ PDF ตามความสูงที่พอดีหน้ากระดาษ
function addCanvasAsPdfPages(doc, canvas, marginMm){
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const contentW = pageW - marginMm * 2;
  const contentH = pageH - marginMm * 2;

  const pxPerMm = canvas.width / contentW;
  const pageHeightPx = Math.max(1, Math.floor(contentH * pxPerMm));

  let renderedY = 0;
  let firstPage = true;
  while(renderedY < canvas.height){
    const sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedY);
    const pageCanvas = document.createElement('canvas');
    pageCanvas.width = canvas.width;
    pageCanvas.height = sliceHeightPx;
    pageCanvas.getContext('2d').drawImage(canvas, 0, renderedY, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

    const sliceHeightMm = sliceHeightPx / pxPerMm;
    if(!firstPage) doc.addPage();
    doc.addImage(pageCanvas.toDataURL('image/png'), 'PNG', marginMm, marginMm, contentW, sliceHeightMm);
    firstPage = false;
    renderedY += sliceHeightPx;
  }
}

// ดาวน์โหลดคำทำนายฉบับเต็ม (Overview, Action Plan, ตีความไพ่ทีละตำแหน่ง, คำตอบสุดท้าย) เป็นไฟล์ PDF
async function exportResultAsFullPDF(){
  const entry = state.currentReading;
  if(!entry) return;
  if(typeof window.jspdf === 'undefined' || typeof html2canvas === 'undefined'){
    alert(t('result.pdfGenError'));
    return;
  }
  const btn = document.getElementById('btn-download-pdf');
  if(btn) btn.classList.add('is-busy');
  const el = buildFullReportElement(entry);
  try{
    await waitForImages(el);
    const canvas = await html2canvas(el, { backgroundColor: '#FDF6F0', scale: 2, useCORS: true });
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    addCanvasAsPdfPages(doc, canvas, 10);
    doc.save(`ace-of-tarot-${Date.now()}.pdf`);
  }catch(err){
    console.error('สร้าง PDF ไม่สำเร็จ', err);
    alert(t('result.pdfGenError'));
  }finally{
    el.remove();
    if(btn) btn.classList.remove('is-busy');
  }
}

function buildShareText(entry){
  const cardNames = entry.cards.map(c => c.name).join(', ');
  const summary = entry.summary || {};
  const premiumInfo = SPREAD_CATALOG_SAFE.PREMIUM_READINGS[entry.spreadKey];
  const isOverviewReading = !!(premiumInfo && premiumInfo.skipQuestion);
  const headline = isOverviewReading
    ? t('result.shareTextHeadlineMonthly', {title: (summary.monthly_theme && summary.monthly_theme.title) || entry.question})
    : t('result.shareTextQuestionPrefix', {q: entry.question});
  const closing = isOverviewReading ? (summary.key_message || '') : (summary.answer || '');
  return `✦ ${t('result.aceOfTarot')} ✦\n\n${headline}\n${t('result.shareTextCards', {cards: cardNames})}\n\n${closing}\n\n${t('result.shareTextCta', {url: location.origin})}`;
}

async function shareResult(){
  const entry = state.currentReading;
  if(!entry) return;
  const btn = document.getElementById('btn-share-result');
  if(btn) btn.classList.add('is-busy');
  const shareText = buildShareText(entry);

  try{
    const blob = await renderShareCardToBlob(entry);
    const file = blob ? new File([blob], 'ace-of-tarot.png', { type: 'image/png' }) : null;

    // เบราว์เซอร์ที่รองรับแชร์ไฟล์รูปโดยตรง (ส่วนใหญ่บนมือถือ)
    if(file && navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Ace of Tarot', text: shareText });
      return;
    }
    // เบราว์เซอร์ที่รองรับ Web Share API แต่ไม่รองรับไฟล์ (แชร์แค่ข้อความ)
    if(navigator.share){
      await navigator.share({ title: 'Ace of Tarot', text: shareText });
      return;
    }
    // เบราว์เซอร์เดสก์ท็อปที่ไม่มี Web Share API เลย — คัดลอกข้อความไปยัง clipboard แทน
    await navigator.clipboard.writeText(shareText);
    alert(t('result.clipboardCopied'));
  }catch(err){
    if(err && err.name === 'AbortError') return; // ผู้ใช้กดยกเลิกหน้าต่างแชร์เอง ไม่ต้องแจ้งเตือน
    console.error('Share error:', err);
    alert(t('result.shareError'));
  }finally{
    if(btn) btn.classList.remove('is-busy');
  }
}
